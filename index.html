elongs to someone else. Together, they balance duty to God with duty to community.

The commandments are traditionally grouped into two broad sections, reflecting this balance. The first section (commandments about God) covers having no other gods, not making idols, not misusing God's name, and keeping the Sabbath day holy — establishing the proper relationship between a person and God. The second section (commandments about others) covers honoring parents, not murdering, not committing adultery, not stealing, not bearing false witness (lying about someone), and not coveting — establishing how people should treat one another in community. This structure reflects a broader theme found throughout the Bible: that love and duty toward God and love and duty toward other people are deeply connected, not separate categories. The commandments are often studied not just as a list of prohibitions, but as a framework for what a well-ordered, respectful community and relationship with God might look like.`,reference:"Exodus 20:1-17; also recorded in Deuteronomy 5:6-21",quiz:[{q:"Where were the Ten Commandments given to Moses?",options:["Mount Sinai","The River Jordan","Bethlehem","Nazareth"],correct:0},{q:"The Ten Commandments guide relationships with:",options:["Only God","Only family","Both God and others","Neither God nor others"],correct:2},{q:"Which of these is one of the Ten Commandments?",options:["Do not steal","Always travel far","Collect wealth","Avoid your neighbors"],correct:0}]},{id:"fruits-of-the-spirit",title:"Fruits of the Spirit",summary:"Character shaped from the inside out.",content:`The fruits of the Spirit describe the character that grows in a person living a Spirit-led life: love, joy, peace, patience, kindness, goodness, faithfulness, gentleness, and self-control. Unlike a single good deed, a 'fruit' suggests something that grows naturally over time, the way a tree produces fruit from its roots rather than by force. These qualities are meant to shape everyday behavior, not just religious occasions.

The fruits are often studied in contrast with what the same passage in Galatians calls 'works of the flesh' — behaviors like jealousy, anger, and selfish ambition, presented as the opposite pattern of character. This contrast underlines the core teaching: character isn't just about avoiding a list of bad actions, but about actively cultivating a different, deliberate way of living. The metaphor of 'fruit' also matters because a tree doesn't produce fruit overnight, and it doesn't produce fruit by simply trying harder in the moment — it's the outcome of the tree being well-rooted and consistently nourished over time. Applied to character, this suggests that qualities like patience or self-control aren't built through single dramatic efforts, but through steady, repeated practice, disposition, and — in the religious framing — reliance on the Spirit rather than willpower alone.`,reference:"Galatians 5:22-23",quiz:[{q:"The fruits of the Spirit are best described as:",options:["One-time good deeds","Character that grows naturally over time","Rules with punishments attached","Rituals performed yearly"],correct:1},{q:"Which of these is one of the fruits of the Spirit?",options:["Pride","Patience","Envy","Greed"],correct:1},{q:"The 'fruit' metaphor suggests these qualities:",options:["Appear instantly by force","Grow naturally, like fruit from a tree","Are unrelated to daily life","Only matter in church"],correct:1}]},{id:"life-of-moses",title:"The Life of Moses",summary:"From the river to the mountain.",content:`Moses was raised in the Egyptian palace but later led the Israelites out of slavery in Egypt, an event known as the Exodus. Along the way, he received the Ten Commandments from God on Mount Sinai, forming the moral and legal foundation for the Israelite people. His story is often studied as an example of leadership under pressure, and of guiding a community through a long, difficult journey toward a promised destination.

Moses' story unfolds in recognizable stages worth knowing. He was born during a time when Israelite baby boys were under threat, hidden by his mother, and later found and raised by an Egyptian princess — growing up between two worlds. As an adult, he fled Egypt after defending an Israelite slave, spending years as a shepherd before being called by God, speaking through a burning bush, to return and demand the Israelites' freedom. The confrontation with Pharaoh that followed involved a series of plagues before the Israelites were finally released, crossing the Red Sea to escape pursuing soldiers. Even after receiving the Ten Commandments, Moses led the community through roughly 40 years of wandering before they reached the promised land — a period often studied as a lesson in perseverance, faith, and the difficulty of leading people through prolonged hardship without losing sight of the goal.`,reference:"Exodus 2-14 (birth and the Exodus); Exodus 20 (the Ten Commandments)",quiz:[{q:"Moses is best known for leading the Israelites out of:",options:["Babylon","Egypt","Rome","Persia"],correct:1},{q:"This event is known as:",options:["The Exodus","The Flood","The Ascension","The Nativity"],correct:0},{q:"Moses received the Ten Commandments on:",options:["Mount Sinai","Mount Olives","The River Nile","Mount Ararat"],correct:0}]},{id:"books-of-the-bible",title:"The Books of the Bible",summary:"How the Old and New Testament are organized.",content:`The Bible is divided into two main sections. The Old Testament covers the history, law, and prophecy of Israel before the birth of Jesus. The New Testament covers the life of Jesus (in the four Gospels), the early Christian church (Acts), letters to churches (Epistles), and prophecy (Revelation). Knowing this basic structure helps you find your way around the text and understand which part of the story a given passage belongs to.

The Old Testament itself is often grouped into further categories: the Law (or Pentateuch, the first five books, including Genesis and Exodus), historical books (recounting Israel's history), wisdom and poetry (like Psalms and Proverbs), and the Prophets (major and minor, depending on length), who often called the nation back to faithfulness and sometimes foretold future events. In the New Testament, the four Gospels — Matthew, Mark, Luke, and John — each tell the story of Jesus' life from a slightly different angle and audience, which is why studying them side by side often reveals details one account includes that another leaves out. The Epistles, mostly written by early leaders like Paul, address specific issues facing particular churches, meaning they're often best understood with some sense of who was writing to whom, and why. Recognizing which category a passage belongs to changes how you read it — a poetic Psalm expressing emotion reads differently from a historical account of a battle, even though both sit within the same overall Bible.`,reference:"The Gospels — Matthew, Mark, Luke, John; Acts of the Apostles; Revelation (final book)",quiz:[{q:"The four Gospels are found in which section?",options:["Old Testament","New Testament","Neither","Both equally"],correct:1},{q:"The Old Testament mainly covers events:",options:["After Jesus' birth only","Before the birth of Jesus","Only in modern times","Outside of Israel's history"],correct:1},{q:"Letters written to early churches are called:",options:["Gospels","Epistles","Psalms","Parables"],correct:1}]},{id:"prayer-and-its-importance",title:"Prayer and Its Importance",summary:"Communication in the life of faith.",content:`Prayer is considered a way of communicating with God, expressed in different forms — thanksgiving (expressing gratitude), petition (asking for something needed), confession (acknowledging wrongdoing), and adoration (praising God). Across many traditions, prayer is seen as building and maintaining a relationship, not just a request system. Regular prayer is often described as a habit that shapes a person's character and outlook over time, similar to how consistent practice shapes any skill.

The Lord's Prayer, taught by Jesus as a model, is often studied closely because it touches on all these forms in a short, structured way: it opens with adoration ('hallowed be thy name'), includes petition for daily needs ('give us this day our daily bread'), includes a form of confession and reconciliation ('forgive us our trespasses, as we forgive those who trespass against us'), and closes acknowledging God's authority. This structure is often used as a template for personal prayer more broadly — beginning with acknowledgment of who God is, moving through personal need and honesty about wrongdoing, and closing with trust. Prayer is also commonly practiced both individually (private, personal reflection) and communally (as part of group worship), each serving a different but complementary role — private prayer often focuses on personal honesty and reflection, while communal prayer reinforces shared belief and mutual support within a community.`,reference:"The Lord's Prayer — Matthew 6:9-13; on persistence in prayer — Luke 18:1-8",quiz:[{q:"A prayer of thanksgiving mainly expresses:",options:["A complaint","Gratitude","A request for money","Anger"],correct:1},{q:"Prayer is generally described as building:",options:["A business deal","A relationship with God","A legal contract","A public performance"],correct:1},{q:"Petition, as a form of prayer, mainly involves:",options:["Praising only","Asking for something needed","Ignoring God","Reading only"],correct:1}]}]},{id:"biology",name:"Biology",color:"#FF7AC6",icon:gg,tagline:"The study of living things.",chapters:[{id:"cell-structure",title:"Cell Structure and Function",summary:"The smallest unit of life.",content:`The cell is the basic unit of life — every living thing is made of one or more cells. Plant and animal cells share a nucleus (control center), cytoplasm (jelly-like fluid where reactions happen), and a cell membrane (the gatekeeper deciding what enters and leaves). Plant cells additionally have a rigid cell wall and chloroplasts, which is why plants can stand upright and make their own food from sunlight.

A few more structures, called organelles, do specific jobs inside a cell. Mitochondria are often called the 'powerhouse' of the cell, releasing energy from food through respiration — cells that need lots of energy, like muscle cells, tend to have especially large numbers of them. Ribosomes build proteins, following instructions carried from the nucleus. The vacuole stores water, nutrients, and waste — in plant cells, one large central vacuole helps keep the cell firm and rigid by pressing outward against the cell wall. Organisms are also broadly divided by their cell type: eukaryotic cells (found in plants, animals, and fungi) have a nucleus enclosed in a membrane, while prokaryotic cells (found in bacteria) have no true nucleus, with their genetic material floating freely in the cytoplasm instead — a fundamental difference used to classify all living things into broad categories.`,quiz:[{q:"The control center of a cell is the:",options:["Cell wall","Nucleus","Cytoplasm","Membrane"],correct:1},{q:"What do plant cells have that animal cells don't?",options:["A nucleus","Cytoplasm","A cell wall and chloroplasts","A membrane"],correct:2},{q:"The cell membrane's main job is to:",options:["Make food","Control what enters and leaves the cell","Store water only","Produce sound"],correct:1}]},{id:"classification-living-things",title:"Classification of Living Things",summary:"Sorting life into groups.",content:`Scientists group living things by shared traits, from broad to specific: Kingdom, Phylum, Class, Order, Family, Genus, Species. All living things fall into major kingdoms, including Animalia (animals), Plantae (plants), and Fungi (mushrooms and molds). Two organisms in the same species can breed and produce fertile offspring — that's the clearest test of how closely related they are.

Beyond Animalia, Plantae, and Fungi, two more kingdoms are commonly recognized: Protista (mostly single-celled organisms like amoeba, too varied to fit neatly elsewhere) and Monera (bacteria and other simple organisms without a true nucleus). Every organism also has a scientific name made of two parts — its genus and species — written in italics, like Homo sapiens for humans; this binomial (two-name) system, developed by Carl Linnaeus, gives every organism on Earth one universally recognized name regardless of language, avoiding the confusion of local common names that can vary from place to place. Moving down the classification levels — from Kingdom down to Species — each step groups organisms that are more and more closely related, which is why two organisms sharing the same Genus are far more similar than two organisms only sharing the same Kingdom. This system isn't just filing for its own sake; it reflects real evolutionary relationships between organisms.`,quiz:[{q:"Which is the broadest classification group?",options:["Species","Genus","Kingdom","Family"],correct:2},{q:"Mushrooms and molds belong to which kingdom?",options:["Animalia","Plantae","Fungi","None"],correct:2},{q:"Two organisms of the same species can:",options:["Never interact","Breed and produce fertile offspring","Only exist in captivity","Belong to different kingdoms"],correct:1}]},{id:"photosynthesis",title:"Photosynthesis",summary:"How plants make their own food.",content:`Photosynthesis is how plants turn sunlight into food. Using chlorophyll in their leaves, plants take in carbon dioxide from the air and water from the soil, and with energy from sunlight, convert them into glucose (a sugar for energy) and oxygen. This is why plants release oxygen — it's a byproduct of making their own food, and it's also why nearly all life depends on plants, directly or indirectly.

The overall word equation is: carbon dioxide + water (+ light energy) → glucose + oxygen — and it happens mainly inside chloroplasts, organelles packed with chlorophyll found in leaf cells. A leaf's structure is well suited to this job: broad, flat surfaces maximize light capture, while tiny pores called stomata (mostly on the underside) let carbon dioxide in and oxygen out. Several factors can limit how fast photosynthesis happens, called limiting factors — light intensity, carbon dioxide concentration, and temperature all affect the rate, and whichever one is in shortest supply holds back the whole process, similar to how a chain is only as strong as its weakest link. Photosynthesis and respiration are often studied together as opposite processes: photosynthesis builds glucose and releases oxygen using light energy, while respiration (in both plants and animals) breaks glucose back down and releases energy, consuming oxygen and producing carbon dioxide — together, they form much of the cycle that keeps oxygen and carbon dioxide balanced in the atmosphere.`,quiz:[{q:"What pigment allows plants to capture sunlight?",options:["Melanin","Chlorophyll","Keratin","Hemoglobin"],correct:1},{q:"Photosynthesis produces glucose and:",options:["Carbon dioxide","Oxygen","Nitrogen","Salt"],correct:1},{q:"The raw materials for photosynthesis are:",options:["Oxygen and glucose","Carbon dioxide and water","Salt and sunlight","Nitrogen and soil"],correct:1}]},{id:"human-digestive-system",title:"Human Digestive System",summary:"From mouth to nutrient absorption.",content:`Digestion breaks food down into nutrients the body can use. It starts in the mouth, where chewing and saliva begin breaking food apart. The stomach uses acid and muscular churning to break it down further. Most nutrient absorption happens in the small intestine, where nutrients pass into the bloodstream through its highly folded, finger-like lining. The large intestine absorbs remaining water before waste leaves the body.

Digestion involves two complementary processes throughout the journey: mechanical digestion (physically breaking food into smaller pieces — chewing, churning) and chemical digestion (breaking food down at the molecular level using enzymes). Enzymes are specialized proteins that speed up digestion of specific nutrients — amylase (found in saliva) starts breaking down starches, pepsin (in the stomach) breaks down proteins, and further enzymes from the pancreas continue breaking down fats, proteins, and carbohydrates once food reaches the small intestine. The liver also plays a supporting role, producing bile that helps break large fat globules into smaller ones, making them easier for enzymes to act on. The small intestine's inner lining is covered in tiny finger-like projections called villi, which dramatically increase its surface area — this is precisely what allows so much nutrient absorption to happen efficiently in a relatively short length of intestine.`,quiz:[{q:"Digestion begins in the:",options:["Stomach","Mouth","Large intestine","Liver"],correct:1},{q:"Most nutrient absorption happens in the:",options:["Stomach","Large intestine","Small intestine","Mouth"],correct:2},{q:"The large intestine's main remaining job is to:",options:["Digest fat","Absorb remaining water","Produce saliva","Break down protein"],correct:1}]},{id:"reproduction-in-plants",title:"Reproduction in Plants",summary:"Pollination, fertilization, and seeds.",content:`Many plants reproduce through flowers. Pollen from the male part (the anther) must reach the female part (the stigma) of a flower — a process called pollination, often carried out by wind, insects, or birds. Once pollen reaches the stigma, fertilization occurs, and the flower develops into a fruit containing seeds. Each seed can grow into a new plant, continuing the cycle.

A flower's structure is built specifically for this purpose. The anther, sitting atop the stamen, produces pollen (the male reproductive cells). The stigma, at the top of the carpel, receives that pollen; below it, the ovary contains ovules, which become seeds after fertilization. Flowers that rely on insects for pollination are often brightly colored and scented, with nectar as a reward — an evolved strategy to attract pollinators, while wind-pollinated flowers tend to be small, dull-colored, and produce far more pollen to compensate for how much gets lost to chance. Once a seed forms, it needs the right conditions to germinate (begin growing into a new plant) — generally water, oxygen, and a suitable temperature — after which it uses its own stored food reserves to grow its first root and shoot, before it's able to photosynthesize on its own and become self-sufficient.`,quiz:[{q:"Pollination is the transfer of pollen from the anther to the:",options:["Root","Stigma","Leaf","Stem"],correct:1},{q:"Which of these commonly carries out pollination?",options:["Insects","Rocks","Soil pH","Moonlight"],correct:0},{q:"After fertilization, a flower typically develops into a:",options:["Root","Fruit containing seeds","New flower instantly","Leaf"],correct:1}]},{id:"ecosystems-food-chains",title:"Ecosystems and Food Chains",summary:"Who eats whom, and how energy flows.",content:`An ecosystem is a community of living things interacting with each other and their environment. A food chain shows how energy moves through it: producers (plants) make their own food from sunlight, primary consumers (herbivores) eat producers, and secondary consumers (carnivores or omnivores) eat other consumers. Decomposers break down dead matter, returning nutrients to the soil so producers can use them again — closing the cycle.

Real ecosystems are rarely a single straight chain — they're better represented by a food web, showing how multiple food chains overlap and interconnect, since most animals eat more than one type of food and are eaten by more than one predator. Energy decreases at each step of a food chain — typically only around 10% of the energy at one level transfers usefully to the next, with the rest lost mainly as heat through the organisms' own life processes. This is why food chains rarely have more than four or five levels, and why there are always far more producers than top predators in a healthy ecosystem — there simply isn't enough energy left by the top to support large numbers there. Removing or disrupting even one species from an ecosystem can ripple outward through the whole web, since organisms depend on each other in more ways than a simple straight-line food chain diagram can fully show.`,quiz:[{q:"In a food chain, producers are typically:",options:["Carnivores","Plants that make their own food","Decomposers","Rocks"],correct:1},{q:"An animal that eats only plants is called a:",options:["Carnivore","Herbivore","Decomposer","Producer"],correct:1},{q:"Decomposers mainly help an ecosystem by:",options:["Eating other animals","Breaking down dead matter and returning nutrients to soil","Making their own food from sunlight","Preventing all growth"],correct:1}]}]}];function d1({value:e,color:t,height:n=6}){const r=Math.max(0,Math.min(1,e))*100;return u.jsx("div",{className:"w-full rounded-full overflow-hidden",style:{backgroundColor:w.border,height:n},role:"progressbar","aria-valuenow":Math.round(r),"aria-valuemin":0,"aria-valuemax":100,children:u.jsx("div",{className:"fr-bar-fill h-full rounded-full",style:{width:`${r}%`,backgroundColor:t}})})}function h1({subject:e,onClick:t,doneCount:n}){const r=e.icon;return u.jsx("button",{onClick:t,className:"fr-card-hover group relative text-left rounded-lg overflow-hidden focus:outline-none focus-visible:ring-2 focus-visible:rin
